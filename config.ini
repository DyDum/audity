[scanner]
# Default rules directory
rules_dir = ./rules

# Output directory for reports
output_dir = ./reports

# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_level = INFO

# Log file path
log_file = ./logs/audity.log

# Number of threads for parallel scanning
max_threads = 4

[reports]
# Generate HTML report
generate_html = true

# Generate XML report
generate_xml = true

# Report format version
format_version = 1.0

[remediation]
# Create backup before applying fixes
create_backup = true

# Backup directory
backup_dir = ./backups

# Ask for confirmation before each fix
interactive = true
