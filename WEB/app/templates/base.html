<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../static/css/base.css" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-dark text-light">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-2 d-md-block sidebar bg-dark text-white min-vh-100" id="sidebar-container">
            </nav>  
            <!-- Main content -->
            <main class="col-md-10 ms-sm-auto main-content">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                    <h1 class="h2">{% block page_title %}Dashboard{% endblock %}</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        {% block page_actions %}{% endblock %}
                    </div>
                </div>
                <!-- Alert messages -->
                <div id="alert-container"></div>
                <!-- Page content -->
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/base/sidebar.js"></script>
    <script src="../static/js/base/alert.js"></script>
    <script src="../static/js/base/api.js"></script>
    <script src="../static/js/base/token.js"></script>
    <script src="../static/js/base/ssh.js"></script>
    <script src="../static/js/base/auth.js"></script>
    <script src="../static/js/base/nav.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
